name: YT Facts Auto Publisher

on:
  schedule:
    # Yeh timer har 1 ghante mein run hoga (Minute 0 par)
    - cron: '0 * * * *'
  workflow_dispatch: # Button se manually run karne ke liye

permissions:
  contents: write # 👈 IMPORTANT: Yeh permission bot ko history.json wapas repo me save karne deti hai

jobs:
  publish_video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Pushing back ke liye full history fetch karta hai

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

    - name: Run Automation Script
      env:
        # Apne GitHub repository ke Secrets mein yeh sabhi keys add karein
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Save History Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # history.json ko stage karein
        git add history.json
        
        # Agar file me koi naya change (naya video upload) hua hai tabhi commit karega
        git commit -m "Update history.json with new cooldowns [skip ci]" || echo "No changes to commit"
        
        # Wapas repository me push karein
        git push
